# ─────────────────────────────────────────────
#  AgriIntel360 — Stack complète Docker
# ─────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3
    container_name: agriintel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: stanislas
      POSTGRES_DB: agriintel360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agriintel360"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agriintel_net

  # ── MongoDB ─────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: agriintel_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: stanislas
      MONGO_INITDB_DATABASE: agriintel360
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agriintel_net

  # ── Redis ────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: agriintel_redis
    restart: unless-stopped
    command: redis-server --requirepass stanislas
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "stanislas", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agriintel_net

  # ── Elasticsearch ────────────────────────────
  elasticsearch:
    image: elasticsearch:8.11.1
    container_name: agriintel_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - agriintel_net

  # ── Backend FastAPI ──────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriintel_backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://postgres:stanislas@postgres:5432/agriintel360
      MONGODB_URL: mongodb://admin:stanislas@mongodb:27017/agriintel360
      REDIS_URL: redis://:stanislas@redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - agriintel_net

  # ── pgAdmin (interface web pour PostgreSQL) ─────────────────
  pgadmin:
    image: dpage/pgadmin4:7
    container_name: agriintel_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agri.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - agriintel_net

  # ── MLflow ───────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: agriintel_mlflow
    restart: unless-stopped
    # Stockage fichier local — pas besoin de psycopg2
    command: >
      mlflow server
      --backend-store-uri /mlflow/mlruns
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
      - mlflow_runs:/mlflow/mlruns
    networks:
      - agriintel_net

# ── Volumes ──────────────────────────────────
volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  elasticsearch_data:
  pgadmin_data:
  mlflow_artifacts:
  mlflow_runs:

# ── Network ──────────────────────────────────
networks:
  agriintel_net:
    driver: bridge
